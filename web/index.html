<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WA HD Claim</title><style>*{box-sizing:border-box}body{margin:0;background:#090b10;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:35px 18px}.card{background:#11151c;border:1px solid #252c37;border-radius:22px;padding:24px;margin-top:20px}h1{font-size:42px;margin:12px 0}p{color:#aab3c1;line-height:1.55}.drop{border:1px dashed #46505e;border-radius:18px;padding:42px 15px;text-align:center;cursor:pointer}button{border:0;border-radius:11px;padding:12px 17px;font-weight:700;cursor:pointer;margin:5px 3px}input{display:none}.barbg{height:9px;background:#242a33;border-radius:9px;overflow:hidden}.bar{height:100%;width:0;background:#fff}.claim{font-size:26px;font-weight:800;padding:16px;background:#090b10;border-radius:12px;word-break:break-all;margin:12px 0}.hidden{display:none}.status{margin:12px 0;color:#c3cad4}.green{color:#8ff0ae}</style></head><body><main class="wrap"><small>WHATSAPP VIDEO TOOL</small><h1>WA HD Claim</h1><p>Upload → proses → dapat kode claim → kirim ke bot WhatsApp.</p><section class="card"><div id="drop" class="drop"><div style="font-size:42px">📤</div><h2>Pilih video</h2><p>MP4/MOV/MKV · maksimal 100 MB</p><button id="pick">Pilih Video</button><input id="file" type="file" accept="video/*"></div><div id="work" class="hidden"><p id="name"></p><div class="barbg"><div id="bar" class="bar"></div></div><div id="status" class="status">Menunggu...</div></div><div id="result" class="hidden"><p class="green">✅ Video selesai diproses</p><div id="claim" class="claim"></div><button id="copy">Copy Claim</button><a id="dl"><button>Download</button></a><hr><h3>WhatsApp Bot</h3><p id="wastate">🔴 Offline</p><button id="start">Aktifkan Bot</button><p id="hint"></p></div></section></main><script>const $=id=>document.getElementById(id),file=$('file');$('pick').onclick=()=>file.click();$('drop').onclick=e=>{if(e.target.id!=='pick')file.click()};file.onchange=()=>file.files[0]&&upload(file.files[0]);async function upload(f){if(f.size>100*1024*1024)return alert('Maksimal 100 MB');$('drop').classList.add('hidden');$('work').classList.remove('hidden');$('name').textContent=f.name;$('status').textContent='Mengupload...';let fd=new FormData();fd.append('video',f);let x=new XMLHttpRequest();x.open('POST','/api/upload');x.upload.onprogress=e=>{if(e.lengthComputable){let n=Math.round(e.loaded/e.total*50);$('bar').style.width=n+'%';$('status').textContent='Mengupload '+Math.round(e.loaded/e.total*100)+'%'}};x.onload=()=>{if(x.status!==200)return $('status').textContent=x.responseText;let d=JSON.parse(x.responseText);$('bar').style.width='100%';$('status').textContent='Selesai';$('claim').textContent=d.claim;$('dl').href=d.downloadUrl;$('result').classList.remove('hidden')};x.onerror=()=>$('status').textContent='Koneksi gagal';x.send(fd)}$('copy').onclick=async()=>{await navigator.clipboard.writeText($('claim').textContent);$('copy').textContent='Copied!';setTimeout(()=>$('copy').textContent='Copy Claim',1000)};$('start').onclick=async()=>{ $('hint').textContent='Menyalakan worker...';let r=await fetch('/api/whatsapp/start',{method:'POST'});let d=await r.json();$('hint').textContent=d.ok?'Worker dinyalakan. Tunggu sampai Connected.':'Gagal menyalakan worker';poll()};async function poll(){let r=await fetch('/api/whatsapp/status');let d=await r.json();$('wastate').textContent=d.state==='connected'?'🟢 Connected':d.state==='starting'?'🟡 Connecting...':'🔴 Offline';if(d.state!=='connected')setTimeout(poll,3000)}</script></body></html>
